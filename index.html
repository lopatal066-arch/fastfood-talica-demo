<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast Food Талица — шаурма и позиции меню</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800&family=Baloo+2:wght@800&display=swap">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: #F3C8A8;
    font-family: "Montserrat", system-ui, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    touch-action: pan-y;
  }
  :root { --u: 1px; --n: 1px; --fy: 0px; }

  .stage {
    position: fixed; inset: 0; overflow: hidden;
    user-select: none; -webkit-user-select: none;
    perspective: 1600px;
    perspective-origin: 50% 45%;
  }
  .slide { position: absolute; inset: 0; overflow: hidden; display: none; }
  .slide.on { display: block; }

  .frame {
    position: absolute;
    width: calc(1440 * var(--u));
    height: calc(900 * var(--u));
    left: calc(50% - 720 * var(--u));
    top: calc(50% - 450 * var(--u) + var(--fy));
    transform-style: preserve-3d;
    will-change: transform;
  }
  .layer { position: absolute; inset: 0; will-change: transform; pointer-events: none; }
  .layer.bottle { pointer-events: auto; }

  /* глубина сцены: слои висят на разной высоте по Z */
  .layer.word   { translate: 0 0 -150px; }
  .layer.shadow { translate: 0 0 -40px; }
  .layer.bottle { translate: 0 0 60px; }
  .layer.fruit  { translate: 0 0 120px; }
  .layer.corner { translate: 0 0 190px; }

  .word {
    position: absolute; left: 0; width: 100%; text-align: center;
    font-weight: 800; line-height: 1; white-space: nowrap; color: #fff;
    letter-spacing: 0.005em;
  }

  .shadow {
    position: absolute; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(60, 40, 80, 0.22), rgba(60, 40, 80, 0));
    filter: blur(calc(4 * var(--u)));
  }

  .hero { position: absolute; inset: 0; transform-style: preserve-3d; }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hero canvas.hero-blur { filter: blur(calc(9 * var(--u))); pointer-events: none; }

  .piece { position: absolute; transform-style: preserve-3d; display: none; }
  .piece > .inner {
    width: 100%; height: 100%;
    background-size: contain; background-repeat: no-repeat; background-position: center;
    mix-blend-mode: multiply;
    border-radius: calc(16 * var(--u));
    animation: bob var(--dur, 4s) ease-in-out infinite alternate;
    animation-delay: var(--del, 0s);
  }
  .piece.corner > .inner { filter: blur(calc(9 * var(--u))); }

  @keyframes bob {
    from { transform: translateY(calc(-7 * var(--u))) rotate(calc(var(--rot, 0deg) - 3deg)); }
    to   { transform: translateY(calc(7 * var(--u)))  rotate(calc(var(--rot, 0deg) + 3deg)); }
  }

  /* ---------- интерфейс ---------- */
  .ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .ui a, .ui button {
    pointer-events: auto; background: none; border: 0; color: #fff;
    font: inherit; cursor: pointer; text-decoration: none; padding: 0;
  }
  .ui a:focus-visible, .ui button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; border-radius: 4px; }
  .ui * { text-shadow: 0 1px 6px rgba(90, 70, 40, 0.18); }

  .head {
    position: absolute; left: calc(50 * var(--n)); right: calc(50 * var(--n)); top: calc(26 * var(--n));
    height: calc(50 * var(--n)); display: flex; align-items: center;
  }
  .logo {
    font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800;
    font-size: calc(51 * var(--n)); line-height: 1; letter-spacing: -0.02em;
  }
  .tabs { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: calc(88 * var(--n)); }
  .tabs button { font-size: calc(21 * var(--n)); font-weight: 500; padding: calc(6 * var(--n)) 0; opacity: 0.92; }
  .tabs button[aria-current="true"] { opacity: 1; }
  .underline {
    position: absolute; left: 0; height: 2px; border-radius: 2px; background: #fff;
    transform: translateX(0); width: 0;
    transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1), width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
  }
  .account { margin-left: auto; display: flex; align-items: center; gap: calc(22 * var(--n)); font-size: calc(21 * var(--n)); font-weight: 500; }
  .account .sep { opacity: 0.9; }

  .price {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(96 * var(--n));
    font-size: calc(19 * var(--n)); font-weight: 600; letter-spacing: 0.04em; opacity: 0.95;
    transition: opacity 0.28s ease;
  }
  .price.swap { opacity: 0; }
  .shopnow {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(36 * var(--n));
    font-size: calc(21 * var(--n)); font-weight: 600; letter-spacing: 0.2em;
    padding: calc(10 * var(--n)) calc(16 * var(--n));
  }
  .arrow {
    position: absolute; bottom: calc(30 * var(--n));
    width: calc(52 * var(--n)); height: calc(52 * var(--n));
    display: grid; place-items: center;
  }
  .arrow.prev { left: calc(36 * var(--n)); }
  .arrow.next { right: calc(36 * var(--n)); }
  .arrow svg { width: calc(28 * var(--n)); height: calc(28 * var(--n)); }

  .rise { opacity: 0; }

  /* ---------- мобильный ---------- */
  .mob .head { left: 20px; right: 20px; top: 16px; height: 40px; }
  .mob .logo { font-size: 34px; }
  .mob .account { font-size: 15px; gap: 10px; }
  .mob .tabs { top: 52px; gap: 22px; }
  .mob .tabs button { font-size: 15px; }
  .mob .shopnow { font-size: 15px; bottom: 22px; letter-spacing: 0.18em; }
  .mob .price { font-size: 14px; bottom: 62px; }
  .mob .arrow { width: 48px; height: 48px; bottom: 12px; }
  .mob .arrow.prev { left: 8px; }
  .mob .arrow.next { right: 8px; }
  .mob .arrow svg { width: 24px; height: 24px; }

  @media (prefers-reduced-motion: reduce) {
    .piece > .inner { animation: none !important; }
    .underline, .price { transition: none !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="ui" id="ui">
  <div class="head">
    <a class="logo rise" href="#" data-rise="250">Fast Food</a>
    <div class="tabs" id="tabs"></div>
    <div class="account rise" data-rise="410">
      <a href="#">Заказ</a>
      <span class="sep">|</span>
      <a href="#">Позвонить</a>
    </div>
  </div>
  <div class="underline" id="underline"></div>
  <div class="price" id="price" data-rise="570">400 ₽</div>
  <a class="shopnow rise" href="#" data-rise="570">ЗАКАЗАТЬ</a>
  <button class="arrow prev rise" id="prev" aria-label="Предыдущая позиция" data-rise="490">
    <svg viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 14H4 M12 6l-8 8 8 8"/>
    </svg>
  </button>
  <button class="arrow next rise" id="next" aria-label="Следующая позиция" data-rise="650">
    <svg viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 14h20 M16 6l8 8-8 8"/>
    </svg>
  </button>
</div>

    section.style.background = cfg.bg;

    const frame = document.createElement("div");
    frame.className = "frame";

    const layers = {};
    for (const name of ["word", "shadow", "bottle", "fruit", "corner"]) {

      layers[name] = el;

  let measureCtx = null;
  function inkWidth(text, size, tracking) {

    if ("letterSpacing" in measureCtx) measureCtx.letterSpacing = (tracking * 100).toFixed(2) + "px";
    const m = measureCtx.measureText(text);
    const ink = (m.actualBoundingBoxLeft || 0) + (m.actualBoundingBoxRight || 0);
    return (ink || m.width) * (size / 100);
  }

    } else if (inkWidth(text, 445, spacing) > maxWidth) {
      let lo = 60, hi = 445;
      for (let i = 0; i < 24; i++) {
        const mid = (lo + hi) / 2;
        if (inkWidth(text, mid, spacing) > maxWidth) hi = mid; else lo = mid;
      }
      size = lo;
    }
    return { size, spacing };
  }

  function layout() {
    const { u, fy } = unit();
    document.documentElement.style.setProperty("--u", u + "px");
    document.documentElement.style.setProperty(
      "--n", isMobile ? "1px" : Math.min(1.3, Math.max(0.5, Math.min(window.innerWidth / 1440, window.innerHeight / 900))) + "px"
    );
    document.documentElement.style.setProperty("--fy", fy);
    ui.classList.toggle("mob", isMobile);
    frameW = 1440 * u;

    for (const item of built) {
      const cfg = item.cfg;

      const visibleW = isMobile ? Math.min(1440, window.innerWidth / u) * 0.92 : 1330;
      const fit = fitWord(cfg.word, visibleW);
      item.word.style.fontSize = Math.round(fit.size * u) + "px";
      item.word.style.letterSpacing = fit.spacing + "em";
      const baseline = 403.5 + 0.698 * fit.size / 2;
      item.word.style.top = Math.round((baseline - 0.85 * fit.size) * u) + "px";

      item.hero.style.left = "0px";
      item.hero.style.top = "0px";
      item.hero.style.width = Math.round(1440 * u) + "px";
      item.hero.style.height = Math.round(900 * u) + "px";

      [...item.layers.shadow.children].forEach((el) => {
        const cx = Number(el.dataset.cx), cy = Number(el.dataset.cy);
        const w = Number(el.dataset.w), h = Number(el.dataset.h);
        el.style.left = Math.round((cx - w / 2) * u) + "px";
        el.style.top = Math.round((cy - h / 2) * u) + "px";
        el.style.width = Math.round(w * u) + "px";
        el.style.height = Math.round(h * u) + "px";
      });

      for (const layerName of ["fruit", "corner"]) {
        for (const outer of item.layers[layerName].children) {
          const x = Number(outer.dataset.x), y = Number(outer.dataset.y), w = Number(outer.dataset.w);
          outer.style.left = Math.round(x * u) + "px";
          outer.style.top = Math.round(y * u) + "px";
          outer.style.width = Math.round(w * u) + "px";
          outer.style.height = Math.round(w * u) + "px";
        }
      }
    }

    placeUnderline(false);
  }

  function placeUnderline(animate, idx) {
    const btn = tabButtons[idx === undefined ? current : idx];
    if (!btn) return;
    const r = btn.getBoundingClientRect();
    if (!animate) underline.style.transition = "none";
    underline.style.width = r.width + "px";
    underline.style.transform = "translateX(" + r.left + "px)";
    underline.style.top = r.bottom + (isMobile ? 3 : 4) + "px";
    if (!animate) requestAnimationFrame(() => { underline.style.transition = ""; });
  }

  // ---------- 3D-наклон сцены ----------
  let tiltX = 0, tiltY = 0, targetX = 0, targetY = 0;
  let tiltActive = false;

  function startTilt() {
    if (reduced || isMobile) return;
    tiltActive = true;
    const loop = () => {
      tiltX += (targetX - tiltX) * 0.09;
      tiltY += (targetY - tiltY) * 0.09;
      const tf = "rotateX(" + tiltX.toFixed(3) + "deg) rotateY(" + tiltY.toFixed(3) + "deg)";
      for (const item of built) item.frame.style.transform = tf;
      if (tiltActive) requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  window.addEventListener("pointermove", (e) => {
    if (reduced || isMobile) return;
    const nx = e.clientX / window.innerWidth - 0.5;
    const ny = e.clientY / window.innerHeight - 0.5;
    targetY = nx * 13;
    targetX = -ny * 9;
    if (!tiltActive) startTilt();
  });
  window.addEventListener("pointerleave", () => { targetX = 0; targetY = 0; });

  // ---------- переход ----------
  function cover(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    for (let i = 0; i < COVER_T.length - 1; i++) {
      if (t >= COVER_T[i] && t <= COVER_T[i + 1]) {
        const k = (t - COVER_T[i]) / (COVER_T[i + 1] - COVER_T[i]);
        const s = k * k * (3 - 2 * k);
        return COVER_C[i] + (COVER_C[i + 1] - COVER_C[i]) * s;
      }
    }
    return 1;
  }
  const easeOutQuad = (x) => 1 - (1 - Math.min(1, Math.max(0, x))) ** 2;

  function setTab(index) {
    tabButtons.forEach((b, i) => {
      if (i === index) b.setAttribute("aria-current", "true");
      else b.removeAttribute("aria-current");
    });
  }

  // ценник меняется только после того, как слайд доехал — иначе рассинхрон
  function setPrice(index, animate) {
    const text = SLIDES[index].price;
    if (!animate) { priceEl.textContent = text; priceEl.classList.remove("swap"); return; }
    priceEl.classList.add("swap");
    setTimeout(() => {
      priceEl.textContent = text;
      priceEl.classList.remove("swap");
    }, 280);
  }

  // сообщаем 3D-слою, какой слайд активен (он рисует только его)
  function announce(index) {
    window.dispatchEvent(new CustomEvent("slider:change", { detail: { index } }));
  }

  function goTo(index, dir) {
    if (busy || index === current) return;
    const A = built[current];
    const B = built[index];
    setTab(index);
    placeUnderline(true, index);

    if (reduced) {
      A.section.classList.remove("on");
      B.section.classList.add("on");
      current = index;
      setPrice(index, false);
      announce(index);
      return;
    }

    busy = true;
    A.section.style.zIndex = "2";
    B.section.style.zIndex = "1";
    B.section.classList.add("on");

    const started = performance.now();
    const W = frameW;

    function frame(now) {
      const t = (now - started) / DURATION;
      const c = cover(t);

      A.section.style.clipPath = dir > 0
        ? "inset(0 " + (c * 100) + "% 0 0)"
        : "inset(0 0 0 " + (c * 100) + "%)";
      const drift = -dir * c * 0.14 * W;
      for (const name of Object.keys(A.layers)) A.layers[name].style.transform = "translateX(" + drift + "px)";

      const k = easeOutQuad((t - 0.5) / 0.42);
      const base = dir * (1 - k) * W;
      for (const name of Object.keys(FACTORS)) {
        const target = name === "bottle" ? B.animated.bottle : B.layers[name];
        if (target) target.style.transform = "translateX(" + base * FACTORS[name] + "px)";
      }

      if (k >= 1) { finish(); return; }
      requestAnimationFrame(frame);
    }

    function finish() {
      A.section.style.clipPath = "";
      A.section.style.zIndex = "";
      B.section.style.zIndex = "";
      for (const name of Object.keys(A.layers)) A.layers[name].style.transform = "";
      for (const name of Object.keys(FACTORS)) {
        const el = name === "bottle" ? B.animated.bottle : B.layers[name];
        if (el) el.style.transform = "";
      }
      A.section.classList.remove("on");
      current = index;
      busy = false;
      setPrice(index, true);
      announce(index);
    }

    requestAnimationFrame(frame);
  }

  function next() { goTo((current + 1) % SLIDES.length, 1); }
  function prev() { goTo((current - 1 + SLIDES.length) % SLIDES.length, -1); }

  // ---------- ввод ----------
  function touch() { lastInteraction = Date.now(); }

  document.getElementById("next").addEventListener("click", () => { touch(); next(); });
  document.getElementById("prev").addEventListener("click", () => { touch(); prev(); });

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { touch(); next(); }
    if (e.key === "ArrowLeft") { touch(); prev(); }
  });

  let downX = 0, downY = 0, tracking = false;
  stage.addEventListener("pointerdown", (e) => { downX = e.clientX; downY = e.clientY; tracking = true; touch(); });
  window.addEventListener("pointerup", (e) => {
    if (!tracking) return;
    tracking = false;
    const dx = e.clientX - downX, dy = e.clientY - downY;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
      touch();
      if (dx < 0) next(); else prev();
    }
  });

  // пока курсор над сценой — не листаем сами, чтобы ничего не «прыгало» под рукой
  let hovering = false;
  stage.addEventListener("pointerenter", () => { hovering = true; lastInteraction = Date.now(); });
  stage.addEventListener("pointerleave", () => { hovering = false; lastInteraction = Date.now(); });

  setInterval(function () {
    if (document.hidden) return;
    if (hovering) return;
    if (Date.now() - lastInteraction < 6000) return;
    next();
  }, 2600);

  window.addEventListener("resize", () => { layout(); });

  // ---------- открытие ----------
  function reveal() {
    const first = built[0];
    if (!reduced) {
      for (const name of Object.keys(FACTORS)) {
        const el = name === "bottle" ? first.animated.bottle : first.layers[name];
        el.animate(
          [{ transform: "translateX(" + FACTORS[name] * frameW + "px)" }, { transform: "translateX(0px)" }],
          { duration: 900, easing: EASE, fill: "both" }
        );
      }
    }
    const rises = [...ui.querySelectorAll("[data-rise]")];
    const clear = () => rises.forEach((el) => { el.style.opacity = "1"; el.style.translate = "none"; });
    if (reduced) { clear(); return; }
    rises.forEach((el) => {
      el.animate(
        [{ opacity: 0, translate: "0 14px" }, { opacity: 1, translate: "0 0" }],
        { duration: 1000, delay: Number(el.dataset.rise), easing: EASE, fill: "both" }
      );
    });
    setTimeout(clear, 3000);
  }

  function boot() {
    lastInteraction = Date.now();
    layout();
    setPrice(0, false);
    placeUnderline(false);
    reveal();
    announce(0);
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(boot).catch(boot);
  } else {
    window.addEventListener("load", boot);
  }
  window.addEventListener("load", () => layout());
})();
</script>

const mat = (color, rough = 0.85, metal = 0) =>
  new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, flatShading: true });

const C = {
  lavash: 0xE8C29B, meat: 0xB9643C, lettuce: 0x7FB069, tomato: 0xD64545,
  foil: 0xCFCFCF, cupRed: 0xD9422E, cupPaper: 0xF7E7CF, fry: 0xF2C14E,
  tray: 0xF0DFC4, potato: 0xD79C4A, nugget: 0xE0A85C
};

// ---------- модели ----------
function buildShawerma() {
  const g = new THREE.Group();

  // сам ролл
  const wrap = new THREE.Mesh(new THREE.CylinderGeometry(0.40, 0.45, 1.55, 16, 1), mat(C.lavash));
  g.add(wrap);

  // тёмная полоса бумаги посередине
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.415, 0.452, 0.46, 16, 1, true), mat(0xD9B183, 0.95));
  band.position.y = -0.2;
  g.add(band);

  // фольга снизу — узкая, как обёртка
  const foil = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.40, 0.42, 16), mat(C.foil, 0.3, 0.8));
  foil.position.y = -0.66;
  g.add(foil);

  // мясо — видно сверху
  const meat = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.28, 0.22, 12), mat(C.meat, 0.9));
  meat.position.y = 0.72;
  g.add(meat);

  // начинка торчит из ролла
  const bits = [
    [C.lettuce, 0.13, 0.84, 0.06, 0.13],
    [C.tomato, -0.14, 0.8, 0.09, 0.11],
    [C.lettuce, 0.03, 0.9, -0.1, 0.11],
    [C.meat, 0.17, 0.76, -0.07, 0.12],
    [C.tomato, -0.02, 0.78, 0.15, 0.1]
  ];
  for (const [color, x, y, z, s] of bits) {
    const b = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0), mat(color));
    b.position.set(x, y, z);
    b.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    g.add(b);
  }

  // наклон, как будто ролл в руке
  g.rotation.z = -0.34;
  g.rotation.x = 0.08;
  return g;
}

function buildFries() {
  const g = new THREE.Group();

  // стакан
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.32, 0.95, 4, 1, true), mat(C.cupRed, 0.75));
  cup.rotation.y = Math.PI / 4;
  cup.position.y = -0.25;
  g.add(cup);

  const cupBottom = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.06, 4), mat(C.cupRed, 0.75));
  cupBottom.rotation.y = Math.PI / 4;
  cupBottom.position.y = -0.72;
  g.add(cupBottom);

  // картошка
  for (let i = 0; i < 16; i++) {
    const f = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.72, 0.09), mat(C.fry, 0.8));
    const a = (i / 16) * Math.PI * 2;
    const r = 0.1 + Math.random() * 0.22;
    f.position.set(Math.cos(a) * r, 0.25 + Math.random() * 0.12, Math.sin(a) * r);
    f.rotation.set((Math.random() - 0.5) * 0.5, Math.random() * 3, (Math.random() - 0.5) * 0.5);
    g.add(f);
  }
  return g;
}

function buildWedges() {
  const g = new THREE.Group();

  // картонная подложка
  const tray = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.1, 0.9), mat(C.tray, 0.95));
  tray.position.y = -0.5;
  g.add(tray);

  // дольки
  for (let i = 0; i < 9; i++) {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.55, 6), mat(C.potato, 0.95));
    const row = Math.floor(i / 3), col = i % 3;
    w.position.set(-0.35 + col * 0.35 + (Math.random() - 0.5) * 0.08,
      -0.22 + row * 0.14,
      -0.15 + row * 0.12 + (Math.random() - 0.5) * 0.1);
    w.rotation.set(Math.PI / 2 + (Math.random() - 0.5) * 0.4, Math.random() * 3, (Math.random() - 0.5) * 0.5);
    g.add(w);
  }
  return g;
}

function buildNuggets() {
  const g = new THREE.Group();

  const tray = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.12, 0.85), mat(C.tray, 0.95));
  tray.position.y = -0.45;
  g.add(tray);

  const spots = [[-0.28, 0.02, -0.16], [0.24, 0.02, -0.12], [-0.05, 0.02, 0.18], [0.3, 0.02, 0.22], [-0.32, 0.02, 0.2]];
  for (const [x, y, z] of spots) {
    const n = new THREE.Mesh(new THREE.IcosahedronGeometry(0.24, 0), mat(C.nugget, 0.9));
    n.position.set(x, y, z);
    n.scale.set(1.35, 0.72, 1);
    n.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    g.add(n);
  }
  return g;
}

const PIECES = {
  shawerma: {
    sharp: [[383, 178, 104, 0], [960, 232, 118, 0], [295, 478, 129, -8], [1247, 455, 123, 15], [968, 590, 110, 30]],

  }
};

const CAM_Z = 4.6;
const FOV = 34;
// сколько мировых единиц приходится на пиксель кадра 1440×900
const VISIBLE_H = 2 * CAM_Z * Math.tan((FOV / 2) * Math.PI / 180);
const K = VISIBLE_H / 900;

const items = [...document.querySelectorAll("canvas.hero-3d.hero-3d, canvas.hero-3d")].length
  ? [...document.querySelectorAll("canvas.hero-3d")]
  : [];
const slides = [];
const byModel = new Map();
for (const canvas of items) {
  const key = canvas.dataset.model;
  if (!byModel.has(key)) byModel.set(key, { key, sharp: null, blur: null });
  const slot = byModel.get(key);
  if (canvas.dataset.blurred) slot.blur = canvas;
  else slot.sharp = canvas;
}
for (const slot of byModel.values()) slides.push(slot);

let active = 0;
const ORDER = ["shawerma", "fries", "hotdog", "burger"];

function shadowTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(64, 64, 4, 64, 64, 62);
  g.addColorStop(0, "rgba(60,40,80,0.32)");
  g.addColorStop(1, "rgba(60,40,80,0)");
  x.fillStyle = g;
  x.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const SHADOW_TEX = shadowTexture();

function makeLayer(canvas) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);
  camera.position.set(0, 0.1, CAM_Z);

  scene.add(new THREE.AmbientLight(0xffffff, 1.15));
  const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
  keyLight.position.set(2.4, 3.6, 2.8);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0xffd9b3, 0.85);
  fillLight.position.set(-2.6, 1.0, 1.6);
  scene.add(fillLight);

  const holder = new THREE.Group();
  scene.add(holder);
  return { canvas, renderer, scene, camera, holder, ready: false };
}

function sizeLayer(layer) {
  const w = layer.canvas.clientWidth || 1;
  const h = layer.canvas.clientHeight || 1;
  layer.renderer.setSize(w, h, false);
  layer.camera.aspect = w / h;
  layer.camera.updateProjectionMatrix();
}

const shadowMesh = () => {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(3.2, 1.9),
    new THREE.MeshBasicMaterial({ map: SHADOW_TEX, transparent: true, depthWrite: false })
  );
  m.rotation.x = -Math.PI / 2;
  m.position.y = -0.56;
  return m;
};

function normalizedClone(source) {
  const clone = source.clone(true);
  return clone;
}

function addPieces(sharpLayer, blurLayer, slot, source) {
  const cfg = PIECES[slot.key];
  if (!cfg) return;

  const box = new THREE.Box3().setFromObject(source);
  const size = box.getSize(new THREE.Vector3());
  const baseDim = Math.max(size.x, size.y, size.z) || 1;

  const place = (list, target) => {
    for (const [px, py, pw, rot] of list) {
      const clone = normalizedClone(source);
      const targetW = ((pw * K) / baseDim) * 0.9;
      clone.scale.multiplyScalar(targetW);
      clone.position.set((px + pw / 2 - 720) * K, (450 - (py + pw / 2)) * K, -0.35);
      clone.rotation.z = THREE.MathUtils.degToRad(rot);
      clone.rotation.y = Math.random() * Math.PI * 2;
      clone.traverse((o) => {
        if (o.isMesh && o.material) {
          o.material = Array.isArray(o.material)
            ? o.material.map((m) => m.clone())
            : o.material.clone();
          o.material.transparent = true;
          o.material.opacity = 0.97;
        }
      });
      target.holder.add(clone);
      // каждый кусочек крутится сам, со своей скоростью и направлением
      slot.pieceNodes = slot.pieceNodes || [];
      slot.pieceNodes.push({
        node: clone,
        speed: 0.0007 + Math.random() * 0.0011,
        dir: Math.random() < 0.5 ? -1 : 1
      });
    }
  };

  place(cfg.sharp, sharpLayer);
  place(cfg.blur, blurLayer || sharpLayer);
}

function buildSlide(slot) {
  if (slot.built) return;
  slot.built = true;

  slot.sharpLayer = makeLayer(slot.sharp);
  slot.blurLayer = slot.blur ? makeLayer(slot.blur) : null;

  const finish = (model) => {
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    // вписываем целиком, с запасом по краям
    const fit = Math.min(1.85 / (size.x || 1), 1.05 / (size.y || 1), 1.85 / (size.z || 1));
    model.scale.multiplyScalar(fit);

    const rot = MODEL_ROT[GLB_FOR[slot.key]] || [0, 0.5];
    model.rotation.set(rot[0], rot[1], 0);

    const box2 = new THREE.Box3().setFromObject(model);
    const c = box2.getCenter(new THREE.Vector3());
    model.position.x -= c.x;
    model.position.z -= c.z;
    model.position.y += -0.55 - box2.min.y;

    // котлета в сэндвиче красилась в цвет палитры неправильно — задаём свой
    if (slot.key === "shawerma") {
      model.traverse((o) => {
        if (o.isMesh && o.name === "meat" && o.material) {
          const m = Array.isArray(o.material) ? o.material[0] : o.material;
          m.map = null;
          m.color.set(0x9C5A2E);
          m.roughness = 0.9;
          m.metalness = 0;
          m.needsUpdate = true;
        }
      });
    }

    // запоминаем части, чтобы «разбирать» модель при наведении:
    // слои расходим симметрично по высоте — стопка разъезжается, но центр остаётся
    const centerBox = new THREE.Box3().setFromObject(model);
    const center = centerBox.getCenter(new THREE.Vector3());
    const raw = [];
    model.traverse((o) => {
      if (!o.isMesh) return;
      const world = new THREE.Vector3();
      o.getWorldPosition(world);
      const local = model.worldToLocal(world.clone());
      raw.push({ mesh: o, y: local.y - center.y });
    });
    const levels = [...new Set(raw.map((r) => Math.round(r.y * 20) / 20))].sort((a, b) => a - b);
    const spread = 0.105;
    slot.parts = raw.map((r) => {
      const idx = levels.indexOf(Math.round(r.y * 20) / 20);
      const offset = new THREE.Vector3(0, (idx - (levels.length - 1) / 2) * spread, 0);
      return { mesh: r.mesh, base: r.mesh.position.clone(), offset };
    });
    slot.explode = 0;
    slot.explodeTarget = 0;

    slot.sharpLayer.holder.add(shadowMesh());
    slot.sharpLayer.holder.add(model);

    addPieces(slot.sharpLayer, slot.blurLayer, slot, model);
    slot.model = model;
    sizeAll();
  };

  const glbKey = GLB_FOR[slot.key];
  if (glbKey && GLB_MODELS[glbKey]) {
    fetch(GLB_MODELS[glbKey])
      .then((r) => r.arrayBuffer())
      .then((buf) => new Promise((res, rej) => new GLTFLoader().parse(buf, "", res, rej)))
      .then((gltf) => {
        const model = gltf.scene;
        const palette = new THREE.TextureLoader().load(COLORMAP);
        palette.colorSpace = THREE.SRGBColorSpace;
        palette.flipY = false;
        model.traverse((o) => {
          if (o.isMesh && o.material) {
            o.material = Array.isArray(o.material) ? o.material.map((m) => m.clone()) : o.material.clone();
            for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
              m.map = palette;
              m.needsUpdate = true;
            }
          }
        });
        finish(model);
      })
      .catch(() => finish((BUILD[slot.key] || buildShawerma)()));
  } else {
    finish((BUILD[slot.key] || buildShawerma)());
  }
}

function sizeAll() {
  for (const slot of slides) {
    if (!slot.built) continue;
    sizeLayer(slot.sharpLayer);
    if (slot.blurLayer) sizeLayer(slot.blurLayer);
  }
}

function activate(index) {
  active = Math.max(0, Math.min(slides.length - 1, Number(index) || 0));
  const slot = slides[active];
  if (!slot) return;
  buildSlide(slot);
  sizeAll();
}

window.addEventListener("slider:change", (e) => activate(e.detail && e.detail.index));
window.addEventListener("resize", sizeAll);

// наведение: модель разбирается на части, убираешь курсор — собирается
// «навёл на блюдо» считаем по расстоянию до центра экрана:
// навёл мышку на модель — разобралась, увёл — собралась
window.addEventListener("pointermove", (e) => {
  const slot = slides[active];
  if (!slot) return;
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight * 0.52;
  const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
  slot.explodeTarget = dist < Math.min(window.innerWidth, window.innerHeight) * 0.34 ? 1 : 0;
});
window.addEventListener("pointerleave", () => {
  const slot = slides[active];
  if (slot) slot.explodeTarget = 0;
});

// плавное вращение: отпустили — модель мягко доезжает
for (const slot of slides) {
  let dragging = false, lastX = 0;
  const canvas = slot.sharp;
  if (canvas) {
    canvas.addEventListener("pointerdown", (e) => { dragging = true; lastX = e.clientX; });
  }
  window.addEventListener("pointerup", () => { dragging = false; });
  window.addEventListener("pointermove", (e) => {
    if (!dragging || slides[active] !== slot) return;
    slot.targetSpin = (slot.targetSpin || 0) + (e.clientX - lastX) * 0.01;
    lastX = e.clientX;
  });
  slot.spin = 0;
  slot.targetSpin = 0;
}

let last = performance.now();
function tick(now) {
  const dt = Math.min(64, now - last);
  last = now;
  const slot = slides[active];
  if (slot && slot.built) {
    const dragging = false;
    slot.targetSpin += 0.0016 * dt * 0.06; // медленное автовращение
    slot.spin += (slot.targetSpin - slot.spin) * Math.min(1, dt * 0.0022); // плавное сглаживание
    if (slot.model) slot.model.rotation.y = (MODEL_ROT[GLB_FOR[slot.key]] || [0, 0.5])[1] + slot.spin * 0.6;

    if (slot.pieceNodes) {
      for (const p of slot.pieceNodes) p.node.rotation.y += p.speed * p.dir;
    }

    // плавно разбираем/собираем
    if (slot.parts && slot.parts.length) {
      slot.explode += ((slot.explodeTarget || 0) - slot.explode) * Math.min(1, dt * 0.006);
      const k = slot.explode;
      for (const part of slot.parts) {
        part.mesh.position.copy(part.base).addScaledVector(part.offset, k);
      }
    }

    const sizeCheck = (layer) => {
      if (!layer) return;
      const cw = layer.canvas.clientWidth || 1, ch = layer.canvas.clientHeight || 1;
      if (cw !== layer.lastW || ch !== layer.lastH) {
        layer.lastW = cw; layer.lastH = ch;
        sizeLayer(layer);
      }
      layer.renderer.render(layer.scene, layer.camera);
    };
    sizeCheck(slot.sharpLayer);
    sizeCheck(slot.blurLayer);
  }
  requestAnimationFrame(tick);
}

window.__pieceRot = () => (slides[active] && slides[active].pieceNodes || []).map((p) => Number(p.node.rotation.y.toFixed(3)));

window.__explode = () => slides.map((s) => ({ key: s.key, ex: Number((s.explode || 0).toFixed(2)), tgt: s.explodeTarget || 0, parts: (s.parts || []).length }));

window.__mats = () => {
  const out = [];
  for (const slot of slides) {
    if (!slot.model) continue;
    slot.model.traverse((o) => {
      if (o.isMesh) {
        const m = Array.isArray(o.material) ? o.material[0] : o.material;
        out.push({
          slide: slot.key,
          mesh: o.name || "(без имени)",
          mat: m.name || "(без имени)",
          color: m.color ? "#" + m.color.getHexString() : null,
          hasMap: !!m.map,
          posY: Number((o.position ? o.position.y : 0).toFixed(3))
        });
      }
    });
  }
  return out;
};

activate(0);
requestAnimationFrame(tick);
</script>


</body>
</html>
